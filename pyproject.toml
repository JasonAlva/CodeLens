[project]
name = "codelens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JasonAlva", email = "alvajasonofficial@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.5.0",
    "matplotlib>=3.10.9",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "sentence-transformers>=6.0.1",
    "typing-extensions>=4.16.0",
]

[project.scripts]
codelens = "codelens.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
